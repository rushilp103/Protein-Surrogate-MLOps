# EGFR + Gefitinib micro-dataset for initial pipeline testing.
# Scale mutations to 50–200 in Step 7.

protein:
  name: EGFR
  uniprot_id: P00533
  alphafold_id: AF-P00533-F1

drug:
  name: Gefitinib
  pubchem_cid: 123631
  smiles: "COc1cc2ncnc(Nc3ccc(F)c(Cl)c3)c2cc1OCCCN1CCOCC1"

mutations:
  - L858R
  - T790M
  - G719S

paths:
  raw: data/raw
  mutants: data/mutants
  docking: data/docking
  processed: data/processed
  models: models
  outputs: outputs

docking:
  exhaustiveness: 8
  num_modes: 9
  # Binding-site box centered on the EGFR kinase ATP pocket (Å)
  center:
    x: -50.0
    y: 0.0
    z: -20.0
  size:
    x: 22.0
    y: 22.0
    z: 22.0

training:
  target_column: vina_score
  group_column: residue_position
  n_splits: 3
  random_state: 42
